name: CLA

# Asks pull-request authors to sign the CLA (CLA.md) via a bot comment and
# blocks the PR until they do. Signatures are stored as JSON in this repo
# under .github/signatures/ — no external service involved.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ".github/signatures/cla.json"
          path-to-document: "https://github.com/esmeepeters/owlypost/blob/main/CLA.md"
          branch: "main"
          allowlist: "esmeepeters,dependabot[bot],bot*"
